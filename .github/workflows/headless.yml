name: Headless verification

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # Bound the package install so a stalled mirror connection fails fast
      # instead of burning the whole job timeout; apt retries stalled fetches.
      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install --yes --no-install-recommends \
            cmake g++ pkg-config python3 libsdl2-dev libsdl2-ttf-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build application
        run: cmake --build build --parallel 2

      - name: Run headless verification suite
        run: ctest --test-dir build --output-on-failure

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # Bound the package install so a stalled mirror connection fails fast
      # instead of burning the whole job timeout; apt retries stalled fetches.
      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install --yes --no-install-recommends \
            cmake g++ pkg-config python3 libsdl2-dev libsdl2-ttf-dev

      - name: Configure sanitized application
        run: >-
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitized application
        run: cmake --build build-sanitized --parallel 2

      - name: Run sanitized headless verification suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          CXXFLAGS: -g -fsanitize=address,undefined -fno-omit-frame-pointer
        run: ctest --test-dir build-sanitized --output-on-failure
