name: Agent patch Drawing state test
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent-patch-drawing-state
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta
      - name: Apply Drawing 7.52 test and docs patch
        run: python3 scripts/_agent_patch_752.py
      - name: Commit push and remove one-shot files
        run: |
          git config user.name "DanielMellen-University"
          git config user.email "113362200+DanielMellen-University@users.noreply.github.com"
          rm -f .github/workflows/agent-patch-drawing-state.yml
          rm -f scripts/_agent_patch_752.py scripts/_agent_patch_752_payload.b64
          git add -A
          git status
          git commit -m "$(cat <<'EOF'
          test(drawing): cover clamp and oversized streamed .modr I/O

          docs(agent): complete bounded Drawing file I/O
          EOF
          )"
          git push origin HEAD:beta
